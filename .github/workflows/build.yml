name: Build IPA

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: macos-13

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.2.app

      - name: Build archive
        run: |
          xcodebuild archive \
            -project UDPFlooder.xcodeproj \
            -scheme UDPFlooder \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/UDPFlooder.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Export IPA (unsigned)
        run: |
          mkdir -p build/ipa
          cp -r build/UDPFlooder.xcarchive/Products/Applications/UDPFlooder.app build/ipa/
          cd build/ipa
          mkdir Payload
          mv UDPFlooder.app Payload/
          zip -r UDPFlooder.ipa Payload/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: UDPFlooder-ipa
          path: build/ipa/UDPFlooder.ipa
          retention-days: 30
